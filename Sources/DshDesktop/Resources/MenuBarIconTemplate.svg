  <g stroke="#000000" stroke-width="1.6" stroke-linecap="round" fill="none">
    <line x1="10" y1="10" x2="28" y2="10"/>
    <line x1="10" y1="28" x2="28" y2="28"/>
    <line x1="10" y1="10" x2="10" y2="28"/>
    <line x1="28" y1="10" x2="28" y2="28"/>
    <line x1="10" y1="10" x2="19" y2="19"/>
    <line x1="28" y1="10" x2="19" y2="19"/>
    <line x1="10" y1="28" x2="19" y2="19"/>
    <line x1="28" y1="28" x2="19" y2="19"/>
  </g>
  <circle cx="10" cy="10" r="2.6" fill="#000000"/>
  <circle cx="28" cy="10" r="2.6" fill="#000000"/>
  <circle cx="10" cy="28" r="2.6" fill="#000000"/>
