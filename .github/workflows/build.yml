name: build & test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: build, test, bundle, dmg
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version | head -2

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: |
            .build/
            ~/Library/Caches/org.swift.swiftpm/
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build (release)
        run: swift build -c release

      - name: Test (strict — warnings as errors)
        run: swift test -Xswiftc -warnings-as-errors --parallel

      - name: Bundle .app + sign
        run: |
          ./scripts/bundle.sh
          ./scripts/sign.sh

      - name: Build DMG
        run: ./scripts/dmg.sh

      - name: Upload .app + .dmg as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DshDesktop-${{ github.sha }}
          path: |
            build/DshDesktop.app
            build/*.dmg
          if-no-files-found: error
          retention-days: 14